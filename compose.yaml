# `docker compose up --build` → http://localhost:4180 (no Node.js needed on the host)
# Port 4180 instead of 8080: 8080 is the most used alternative HTTP port and was already taken by a Windows
# service on the dev machine. Override with WEB_PORT if 4180 is busy: `WEB_PORT=9000 docker compose up --build`.
name: saas-o-matic

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      CORS_ORIGIN: http://localhost:${WEB_PORT:-4180}
    volumes:
      - db-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - '${WEB_PORT:-4180}:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
